[project]
name = "galaxy-morphology-classification"
version = "0.1.0"
description = "Interpretable Deep Learning for Galaxy Morphology Classification"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "astropy>=6.1.7",
    "captum>=0.7.0",
    "grad-cam",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "photutils>=2.0.2",
    "pillow>=12.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "timm>=1.0.22",
    "torch",
    "torchvision",
    "tqdm>=4.67.1",
    "wandb>=0.23.1",
]

[tool.uv]
index-url = "https://download.pytorch.org/whl/cu121"
extra-index-url = ["https://pypi.org/simple"]
